[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smart-fork"
version = "0.1.0"
description = "Semantic session discovery for OpenCode"
readme = "VISION.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "David Helmus" }
]
keywords = ["opencode", "sessions", "semantic-search", "vector-database"]

dependencies = [
    "click>=8.0",
    "lancedb>=0.4",
    "tiktoken>=0.5",
    "google-cloud-aiplatform>=1.40",
    "httpx>=0.25",
    "rich>=13.0",
    "pydantic>=2.0",
    "structlog>=24.0",
    "pyarrow>=14.0",
    "mcp[cli]>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.5",
]

[project.scripts]
smart-fork = "smart_fork.cli:main"
smart-fork-mcp = "smart_fork.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["smart_fork"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["smart_fork"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
